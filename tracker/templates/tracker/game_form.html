{% extends "tracker/base.html" %}

{% block title %}{{ mode }} Juego | Game Tracker{% endblock %}

{% block content %}
<h1>{{ mode }} Juego</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'game_list' %}" role="button" class="secondary">Cancelar</a>
</form>
{% endblock %}
